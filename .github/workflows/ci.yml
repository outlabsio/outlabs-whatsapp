name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --extra fastapi --group dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run --with pip-audit pip-audit --skip-editable
      - run: uv build
      - name: Installed wheel smoke
        run: |
          uv venv .artifact-venv --python ${{ matrix.python-version }}
          uv pip install --python .artifact-venv/bin/python dist/*.whl
          .artifact-venv/bin/python -c "import outlabs_whatsapp; assert outlabs_whatsapp.__version__ == '0.1.0a1'"
